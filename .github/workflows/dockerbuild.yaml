name: Build and Push Docker Image

on:
  push:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image tags
        id: vars
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SHORT_SHA=${GITHUB_SHA::7}

          # Prüfen, ob der Branch der Default-Branch ist
          if [[ "${BRANCH_NAME}" == "${{ github.event.repository.default_branch }}" ]]; then
            echo "LATEST_TAG=${IMAGE_NAME}:latest" >> $GITHUB_ENV
          else
            echo "LATEST_TAG=" >> $GITHUB_ENV  # Kein "latest"-Tag setzen
          fi

          echo "BRANCH_TAG=${IMAGE_NAME}:${BRANCH_NAME}" >> $GITHUB_ENV
          echo "SHA_TAG=${IMAGE_NAME}:${SHORT_SHA}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.SHA_TAG }}
            ${{ env.BRANCH_TAG }}
            ${{ env.LATEST_TAG }}
