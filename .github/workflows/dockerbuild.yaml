name: Build and Push Multi-Arch Docker Image

on:
  push:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image tags (lowercase)
        id: vars
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${GITHUB_SHA::7}" | tr '[:upper:]' '[:lower:]')

          IMAGE_NAME="ghcr.io/${REPO_NAME}"

          if [[ "${BRANCH_NAME}" == "$(echo '${{ github.event.repository.default_branch }}' | tr '[:upper:]' '[:lower:]')" ]]; then
            echo "LATEST_TAG=${IMAGE_NAME}:latest" >> $GITHUB_ENV
          else
            echo "LATEST_TAG=" >> $GITHUB_ENV  # Kein "latest"-Tag setzen
          fi

          echo "BRANCH_TAG=${IMAGE_NAME}:${BRANCH_NAME}" >> $GITHUB_ENV
          echo "SHA_TAG=${IMAGE_NAME}:${SHORT_SHA}" >> $GITHUB_ENV

      - name: Build and push Multi-Arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7  # 👈 WICHTIG: ARCHITEKTUREN ANGEBEN!
          tags: |
            ${{ env.SHA_TAG }}
            ${{ env.BRANCH_TAG }}
            ${{ env.LATEST_TAG }}
