kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-bot-config
  namespace: {{ .Release.Namespace }}
data:
  script.sh: |
    #!/bin/sh
    apk add --update py-pip	> /dev/null
    apk add --update git > /dev/null
    apk add --update bash > /dev/null
    apk add --update openssl > /dev/null
    git clone $REPO --branch $TAG bot
    git clone $CERTIFICATES_REPO certificateFolder 
    pip install -r /bot/requirements.txt > /dev/null
    python /bot/didLoading.py ./../certificateFolder

    sourceFolder="{{ .Values.certificates.sourceFolder}}"
    pattern="{{ .Values.certificates.certFilePattern}}"
    
    if [ -n "$sourceFolder" ] && [ -n "$pattern" ]; then
      ./bot/fingerprints.sh ./../certificateFolder {{ .Release.Name }} $sourceFolder $pattern
      python /bot/updateFingerprints.py ./../certificateFolder/nginx_conf
    else 
      echo "Source Folder and/or certFilePattern empty. Skip the fingerprint pinning"
    fi 

    python /bot/updateCaBundle.py /certificateFolder 
    python /bot/annotateIngress.py
