replicaCount: 1

image:
  repository: nginx
  tag: "1.21.6"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  metadata: 
    name: {{ .Release.Name }}
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []