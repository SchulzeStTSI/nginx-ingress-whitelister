controller:
  config:
    map: ingress-nginx-controller
  namespace: ingress-nginx
config:
  repo: https://github.com/SchulzeStTSI/nginx-ingress-whitelister
  tag: dev
  map:
  configLoader:
    - internal.configLoader.ConfigMapLoader.ConfigMapLoader
    - internal.configLoader.EnvMapLoader.EnvMapLoader
  pubKeyLoader:
    - internal.pubKeyLoader.didLoader.didLoader
    - internal.pubKeyLoader.gitLoader.gitLoader
certificates:
  secret: gateway-ca-bundle
  certPinning: "false"
pubKeyLoader:
 x509:
  repo: https://github.com/SchulzeStTSI/nginx-ingress-whitelister.git
  sourceFolder: TLS
  certFilePattern: TLS*.pem
  caFilePattern: CA*.pem
 didDoc:
  resolverUrl: http://localhost:8080/1.0/identifiers/
  dids: 
  verificationMethods:
    tlsFilter: 
    caFilter:
ingress:
  name: test-ingress
job: 
  schedule: '*/1 * * * *'
universal-resolver:
  service:
    port: 8081
